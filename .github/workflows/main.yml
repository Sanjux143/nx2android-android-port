name: build-apk

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '17 */6 * * *'

jobs:
  tools:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Publish the trimmed NDK (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download tools --pattern ndk-lite-r27c.tar.xz.sha256 -O /tmp/have.sha 2>/dev/null; then echo "already published"; exit 0; fi
          bash tools/make_ndk_lite.sh
          gh release create tools --prerelease --title "Build tools (trimmed Android NDK)" --notes "Only the parts of NDK r27c that the ARM host build reads. Made by tools/make_ndk_lite.sh." 2>/dev/null || true
          gh release upload tools /tmp/ndk-lite-r27c.tar.xz /tmp/ndk-lite-r27c.tar.xz.sha256 --clobber

  prebuilt:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build the porter's .NET tools with runtimes that start on phones
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/make_prebuilt.sh

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Bundle proot and the Ubuntu rootfs
        run: |
          bash tools/fetch_proot.sh
          bash tools/fetch_rootfs.sh

      - name: Update & verify payload manifest
        run: |
          python3 tools/make_manifest.py

      - name: Signing key
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            { echo "KS_FILE=$RUNNER_TEMP/release.p12"; echo "KS_PASS=$KEYSTORE_PASS"; echo "KS_ALIAS=$KEYSTORE_ALIAS"; } >> "$GITHUB_ENV"
          else
            bash tools/signing_key.sh
          fi

      - name: Build the signed release APK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with: { name: nx2android-apk, path: 'app/build/outputs/apk/release/*.apk' }

      - name: Publish the APK as the latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" nx2android.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          { echo "Built from $GITHUB_SHA."; echo; echo '```'; tail -c 1500 "${SIGN_LOG:-/dev/null}" 2>/dev/null; echo '```'; } > "$RUNNER_TEMP/notes.md"
          gh release create latest nx2android.apk --prerelease --target "$GITHUB_SHA" --title "nx2android (latest build)" --notes-file "$RUNNER_TEMP/notes.md"
